<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fantasy MMO — Create Character</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a20; font-family: system-ui, sans-serif; color: #eee; }
    #preview-canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 340px;
      background: rgba(18,18,22,0.92); overflow-y: auto; padding: 18px; box-sizing: border-box;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #9ab; margin: 18px 0 8px; }
    p.sub { color: #999; font-size: 12px; margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: #bbb; margin: 10px 0 4px; }
    select { width: 100%; background: #22222a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; background: #22222a; color: #eee;
      border: 1px solid #444; border-radius: 4px; padding: 8px; font-size: 14px;
    }
    input[type="text"]:focus { outline: none; border-color: #3f88c5; box-shadow: 0 0 0 2px rgba(63,136,197,0.25); }
    input[type="text"].invalid { border-color: #c65b2e; }
    .field-error { min-height: 14px; margin: 4px 0 0; font-size: 11px; color: #e8927c; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
      box-sizing: border-box;
    }
    .swatch.selected { border-color: #fff; }
    .class-cards { display: flex; flex-direction: column; gap: 8px; }
    .class-card {
      background: #22222a; border: 2px solid #333; border-radius: 6px; padding: 10px 12px; cursor: pointer;
    }
    .class-card:hover { border-color: #555; }
    .class-card.selected { border-color: #3f88c5; background: #22303e; }
    .class-card .name { font-weight: 600; font-size: 13px; }
    .class-card .tagline { font-size: 11px; color: #999; margin-top: 2px; }
    #enter-btn {
      width: 100%; margin-top: 18px; padding: 12px; font-size: 14px; font-weight: 600;
      background: #3f8850; border: none; border-radius: 6px; color: #fff; cursor: pointer;
    }
    #enter-btn:hover { background: #4fa060; }
    #enter-btn:disabled { background: #444; cursor: not-allowed; }
    #randomize-btn { width: 100%; margin-top: 8px; padding: 8px; background: #2a2a32; border: 1px solid #444; border-radius: 4px; color: #eee; cursor: pointer; }
    #randomize-btn:hover { background: #3a3a44; }
    #hint { position: fixed; bottom: 8px; left: 8px; color: #888; font-size: 12px; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="preview-canvas"></canvas>
  <div id="hint">Drag to rotate the preview</div>

  <div id="panel">
    <h1>Create Your Character</h1>
    <p class="sub">This is how you'll appear in the world.</p>

    <h2>Name</h2>
    <label for="char-name">Character name</label>
    <input id="char-name" type="text" maxlength="20" autocomplete="off" spellcheck="false"
           placeholder="Ashvale" />
    <p id="name-error" class="field-error" role="alert"></p>

    <h2>Appearance</h2>

    <label>Body</label>
    <select id="body-type"></select>

    <label>Gender</label>
    <select id="gender"></select>

    <label>Hair style</label>
    <select id="hair-style"></select>

    <label>Eye shape</label>
    <select id="eye-style"></select>

    <label>Expression</label>
    <select id="mouth-style"></select>

    <label>Hair dye</label>
    <div class="swatches" id="hair-color-swatches"></div>

    <label>Eye color</label>
    <div class="swatches" id="eye-color-swatches"></div>

    <label>Skin tone</label>
    <div class="swatches" id="skin-tone-swatches"></div>

    <button id="randomize-btn">🎲 Randomize Appearance</button>

    <h2>Class</h2>
    <div class="class-cards" id="class-cards"></div>

    <button id="enter-btn" disabled>Enter World</button>
  </div>

  <script type="module" src="/src/character-creation/main.js"></script>
</body>
</html>
