<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guild Buff Builder — Fantasy MMO</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; font: 13px/1.5 'Lusitana', serif;
      background: #0f0b07; color: #e8d9b5;
    }
    #list-col {
      width: 300px; flex: none; padding: 14px; overflow-y: auto;
      background: linear-gradient(180deg, #2b1e12 0%, #1b140d 100%);
      border-right: 2px solid #8a6423;
    }
    #edit-col { flex: 1; min-width: 0; padding: 18px 22px; overflow-y: auto; }
    h1 { font-family: 'Lusitana', serif; font-size: 17px; margin: 0 0 4px; color: #f4d78a; text-shadow: 0 0 10px rgba(244,215,138,0.3), 0 1px 0 #000; }
    .lede { font-size: 12px; color: rgba(232,217,181,0.6); margin: 0 0 14px; }
    h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: #8a6423;
      margin: 18px 0 6px; border-bottom: 1px solid rgba(217,164,65,0.25); padding-bottom: 3px;
    }
    button {
      font-family: 'Lusitana', serif; font-weight: 600; padding: 6px 10px;
      background: linear-gradient(180deg, #4a3620, #3a2717); color: #f4d78a;
      border: 1px solid #8a6423; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    button:hover { border-color: #d9a441; box-shadow: 0 0 6px rgba(244,215,138,0.3); }
    button.primary { background: linear-gradient(180deg, #5a4326, #241a10); border-color: #d9a441; }
    button.danger:hover { border-color: #c65b2e; box-shadow: 0 0 6px rgba(198,91,46,0.4); }
    label { display: block; margin-top: 9px; font-size: 11px; color: rgba(232,217,181,0.85); }
    input[type=text], input[type=number], textarea, select {
      width: 100%; margin-top: 3px; padding: 6px; background: #3a2717; color: #e8d9b5;
      border: 1px solid #8a6423; border-radius: 5px; font: inherit;
    }
    textarea { resize: vertical; min-height: 52px; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    .row > * { flex: 1; }
    .field2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #buff-list { border: 1px solid #8a6423; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    #buff-list .entry {
      display: flex; gap: 8px; align-items: center; padding: 7px 8px; cursor: pointer;
      border-bottom: 1px solid rgba(217,164,65,0.15);
    }
    #buff-list .entry:hover { background: #3a2717; }
    #buff-list .entry.active { background: linear-gradient(180deg, #5a4326, #3a2717); color: #f4d78a; }
    #buff-list .entry img, #buff-list .entry .ph {
      width: 30px; height: 30px; flex: none; border-radius: 5px; object-fit: cover;
      background: #241a10; display: flex; align-items: center; justify-content: center; color: #8a6423;
    }
    #buff-list .entry .meta { min-width: 0; }
    #buff-list .entry .meta .n { font-size: 13px; }
    #buff-list .entry .meta .s { font-size: 11px; color: rgba(232,217,181,0.55); }
    .effect-row {
      display: grid; grid-template-columns: 1fr 110px auto; gap: 6px; align-items: end;
      border: 1px solid #8a6423; border-radius: 6px; padding: 8px; margin-top: 7px; background: #241a10;
    }
    .effect-row label { margin-top: 0; }
    .preview {
      display: flex; gap: 12px; align-items: center; border: 1px solid rgba(217,164,65,0.35);
      border-radius: 8px; padding: 12px; background: rgba(0,0,0,0.3); margin-top: 6px;
    }
    .preview img, .preview .ph {
      width: 56px; height: 56px; flex: none; border-radius: 7px; object-fit: cover;
      background: #241a10; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #8a6423;
    }
    .preview .p-name { font-size: 16px; color: #f4d78a; }
    .preview .p-eff { color: #7fd18a; font-size: 12px; }
    .preview .p-line { font-size: 12px; color: rgba(232,217,181,0.7); }
    #status { margin-top: 12px; min-height: 17px; font-size: 12px; color: #9dd08a; }
    #status.err { color: #e0955a; }
    .hint { font-size: 11px; color: rgba(232,217,181,0.5); margin-top: 4px; }
    a { color: #d9a441; }
  </style>
</head>
<body>
  <div id="list-col">
    <h1>Guild Buff Builder</h1>
    <p class="lede">Buffs guilds buy with bank gold. Everything authored here shows up in the game's Guild panel under <b>Buffs</b>.</p>
    <div id="buff-list"></div>
    <div class="row">
      <button id="new-btn">New</button>
      <button id="dup-btn">Duplicate</button>
      <button id="del-btn" class="danger">Delete</button>
    </div>
    <div class="row">
      <button id="save-btn" class="primary">Save catalog</button>
    </div>
    <div id="status"></div>
    <p class="hint"><a href="/">&larr; Back to the hub</a></p>
  </div>

  <div id="edit-col">
    <div id="editor"></div>
  </div>

  <script type="module" src="/src/guild-buff-builder/main.js"></script>
</body>
</html>
